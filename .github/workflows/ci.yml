name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect_dir
        run: |
          if [ -f "caply/package.json" ]; then
            echo "dir=caply" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            caply/package-lock.json

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.detect_dir.outputs.dir }}

      - name: Run lint
        run: npm run lint --if-present
        working-directory: ${{ steps.detect_dir.outputs.dir }}

      - name: Build project
        run: npm run build --if-present
        working-directory: ${{ steps.detect_dir.outputs.dir }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: caply_user
          POSTGRES_PASSWORD: caply_password
          POSTGRES_DB: caply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caply_user -d caply_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://caply_user:caply_password@localhost:5432/caply_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect_dir
        run: |
          if [ -f "caply/package.json" ]; then
            echo "dir=caply" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            caply/package-lock.json

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.detect_dir.outputs.dir }}

      - name: Run tests (if present)
        run: npm test --if-present
        working-directory: ${{ steps.detect_dir.outputs.dir }}
