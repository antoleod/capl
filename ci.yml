name: Node.js CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "caply/package.json"

      - name: Install dependencies
        run: npm install
        working-directory: ./caply

      - name: Run Build and Test
        run: |
          npm run build --if-present
          npm test --if-present
        working-directory: ./caply
