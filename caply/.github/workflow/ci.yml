name: Full Stack CI (Tests & DB)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: caply_user
          POSTGRES_PASSWORD: caply_password
          POSTGRES_DB: caply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "caply/package.json"

      - name: Install dependencies
        run: npm install
        working-directory: ./caply

      - name: Build and Test
        env:
          DATABASE_URL: postgresql://caply_user:caply_password@localhost:5432/caply_test
          NODE_ENV: test
          PORT: 3001
        run: |
          npm run build --if-present
          npm test --if-present
        working-directory: ./caply
